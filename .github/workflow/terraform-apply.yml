name: Terraform Apply (VPC + EKS)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  # --- Remote state (aanrader) ---
  # Zet deze liever als GitHub Secrets:
  # TF_STATE_BUCKET, TF_LOCK_TABLE
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      # (optioneel maar handig) Maak backend resources automatisch aan
      - name: Ensure remote backend exists (S3 + DynamoDB)
        run: |
          set -e

          if [ -z "${TF_STATE_BUCKET}" ] || [ -z "${TF_LOCK_TABLE}" ]; then
            echo "ERROR: Missing TF_STATE_BUCKET or TF_LOCK_TABLE secrets."
            echo "Create GitHub Secrets: TF_STATE_BUCKET and TF_LOCK_TABLE"
            exit 1
          fi

          # S3 bucket
          aws s3api head-bucket --bucket "${TF_STATE_BUCKET}" 2>/dev/null || \
            aws s3api create-bucket --bucket "${TF_STATE_BUCKET}" --region "${AWS_REGION}" \
              --create-bucket-configuration LocationConstraint="${AWS_REGION}"

          # (aanrader) versioning aan
          aws s3api put-bucket-versioning --bucket "${TF_STATE_BUCKET}" \
            --versioning-configuration Status=Enabled

          # DynamoDB lock table
          aws dynamodb describe-table --table-name "${TF_LOCK_TABLE}" >/dev/null 2>&1 || \
            aws dynamodb create-table \
              --table-name "${TF_LOCK_TABLE}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST

      # -------------------------
      # VPC
      # -------------------------
      - name: Terraform Init (VPC)
        working-directory: infrastructure/terraform/vpc
        run: |
          set -e
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=vpc/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate (VPC)
        working-directory: infrastructure/terraform/vpc
        run: terraform validate

      - name: Terraform Apply (VPC)
        working-directory: infrastructure/terraform/vpc
        run: terraform apply -auto-approve

      # -------------------------
      # EKS
      # -------------------------
      - name: Terraform Init (EKS)
        working-directory: infrastructure/terraform/eks
        run: |
          set -e
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=eks/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate (EKS)
        working-directory: infrastructure/terraform/eks
        run: terraform validate

      - name: Terraform Apply (EKS)
        working-directory: infrastructure/terraform/eks
        run: terraform apply -auto-approve
