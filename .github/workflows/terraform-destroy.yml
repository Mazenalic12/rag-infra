name: Terraform DESTROY (EKS + VPC)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type EXACT "DESTROY" to confirm'
        required: true
        default: ""

concurrency:
  group: terraform-destroy
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  AWS_REGION: "eu-central-1"
  TF_VAR_region: "eu-central-1"

  # Terraform vars voor EKS remote_state
  TF_VAR_tf_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
  TF_VAR_vpc_state_key: "infrastructure/terraform/vpc/terraform.tfstate"

  # Backend keys voor terraform init
  VPC_STATE_KEY: "infrastructure/terraform/vpc/terraform.tfstate"
  EKS_STATE_KEY: "infrastructure/terraform/eks/terraform.tfstate"

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Safety check
        shell: bash
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo 'Confirmation failed. Type exactly "DESTROY".'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --- DESTROY EKS FIRST ---
      - name: Check state exists - EKS
        id: eks_state
        shell: bash
        run: |
          set -e
          if aws s3api head-object --bucket "${{ secrets.TF_STATE_BUCKET }}" --key "${{ env.EKS_STATE_KEY }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Destroy EKS
        if: steps.eks_state.outputs.exists == 'true'
        working-directory: infrastructure/terraform/eks
        shell: bash
        run: |
          set -e
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="key=${{ env.EKS_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

          terraform validate

          # destroy faalt niet als er niks is, hij doet gewoon 0 changes
          terraform destroy -auto-approve

      - name: Skip EKS (no remote state)
        if: steps.eks_state.outputs.exists != 'true'
        run: echo "EKS state niet gevonden in S3 → EKS destroy skipped."

      # --- THEN DESTROY VPC ---
      - name: Check state exists - VPC
        id: vpc_state
        shell: bash
        run: |
          set -e
          if aws s3api head-object --bucket "${{ secrets.TF_STATE_BUCKET }}" --key "${{ env.VPC_STATE_KEY }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Destroy VPC
        if: steps.vpc_state.outputs.exists == 'true'
        working-directory: infrastructure/terraform/vpc
        shell: bash
        run: |
          set -e
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="key=${{ env.VPC_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

          terraform validate
          terraform destroy -auto-approve

      - name: Skip VPC (no remote state)
        if: steps.vpc_state.outputs.exists != 'true'
        run: echo "VPC state niet gevonden in S3 → VPC destroy skipped."
