name: Terraform DESTROY (EKS + VPC)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type EXACT "DESTROY" to confirm'
        required: true
        default: ""
      aws_region:
        description: "AWS region"
        required: true
        default: "eu-central-1"
      vpc_state_key:
        description: "S3 key for VPC terraform state"
        required: true
        default: "infrastructure/terraform/vpc/terraform.tfstate"
      eks_state_key:
        description: "S3 key for EKS terraform state"
        required: true
        default: "infrastructure/terraform/eks/terraform.tfstate"

concurrency:
  group: terraform-destroy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Safety check
        shell: bash
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo '❌ Confirmation failed. Type exactly "DESTROY".'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false

      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Detect backend bucket region
        shell: bash
        run: |
          set -e
          BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          LOC=$(aws s3api get-bucket-location --bucket "$BUCKET" --query 'LocationConstraint' --output text)
          if [ "$LOC" = "None" ] || [ "$LOC" = "null" ]; then
            LOC="us-east-1"
          fi
          echo "TF_BACKEND_REGION=$LOC" >> $GITHUB_ENV
          echo "Backend bucket region: $LOC"

      - name: Debug - list tfstate files in bucket
        shell: bash
        run: |
          echo "Bucket: ${{ secrets.TF_STATE_BUCKET }}"
          aws s3 ls "s3://${{ secrets.TF_STATE_BUCKET }}/" --recursive | grep -E "\.tfstate$" || true
          echo "Using VPC key: ${{ github.event.inputs.vpc_state_key }}"
          echo "Using EKS key: ${{ github.event.inputs.eks_state_key }}"

      # -------------------------
      # EKS: check state (optional)
      # -------------------------
      - name: Check EKS state exists (set output)
        id: eks_state
        shell: bash
        run: |
          if aws s3api head-object \
            --bucket "${{ secrets.TF_STATE_BUCKET }}" \
            --key "${{ github.event.inputs.eks_state_key }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ EKS state gevonden."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ EKS state niet gevonden (we gaan door met VPC)."
          fi

      - name: Destroy EKS (with state-save recovery)
        if: steps.eks_state.outputs.exists == 'true'
        working-directory: infrastructure/terraform/eks
        shell: bash
        env:
          TF_VAR_region: ${{ github.event.inputs.aws_region }}
          TF_VAR_tf_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
          TF_VAR_vpc_state_key: ${{ github.event.inputs.vpc_state_key }}
        run: |
          set -e

          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="key=${{ github.event.inputs.eks_state_key }}" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="encrypt=true"

          terraform validate

          set +e
          terraform destroy -auto-approve
          rc=$?
          set -e

          if [ $rc -eq 0 ]; then
            echo "✅ EKS destroy klaar."
            exit 0
          fi

          # Recovery als state save faalt
          if [ -f "errored.tfstate" ]; then
            echo "⚠️ State save issue. Recovery: terraform state push..."
            set +e
            terraform state push -force errored.tfstate
            push_rc=$?
            set -e

            if [ $push_rc -eq 0 ]; then
              echo "✅ State push gelukt."
              exit 0
            fi

            echo "⚠️ terraform state push faalde. Fallback upload via aws s3 cp..."
            aws s3 cp errored.tfstate "s3://${{ secrets.TF_STATE_BUCKET }}/${{ github.event.inputs.eks_state_key }}"
            echo "✅ Fallback upload gelukt."
            exit 0
          fi

          echo "❌ EKS destroy faalde (rc=$rc)."
          exit $rc

      # -------------------------
      # VPC: check state (required)
      # -------------------------
      - name: Check VPC state exists (fail if missing)
        shell: bash
        run: |
          if aws s3api head-object \
            --bucket "${{ secrets.TF_STATE_BUCKET }}" \
            --key "${{ github.event.inputs.vpc_state_key }}" >/dev/null 2>&1; then
            echo "✅ VPC state gevonden."
          else
            echo "❌ VPC state NIET gevonden: s3://${{ secrets.TF_STATE_BUCKET }}/${{ github.event.inputs.vpc_state_key }}"
            exit 1
          fi

      # (optioneel maar helpt vaak) haal VPC_ID uit state en verwijder ALB/NLB in die VPC
      - name: Read VPC id from state
        id: vpcid
        working-directory: infrastructure/terraform/vpc
        shell: bash
        env:
          TF_VAR_region: ${{ github.event.inputs.aws_region }}
        run: |
          set -e
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="key=${{ github.event.inputs.vpc_state_key }}" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="encrypt=true"

          VPC_ID="$(terraform output -raw vpc_id 2>/dev/null || true)"
          echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
          echo "VPC_ID=$VPC_ID"

      - name: Pre-clean load balancers in VPC (ALB/NLB)
        if: steps.vpcid.outputs.vpc_id != ''
        shell: bash
        run: |
          set -e
          REGION="${{ github.event.inputs.aws_region }}"
          VPC_ID="${{ steps.vpcid.outputs.vpc_id }}"
          echo "Zoeken naar ELBv2 in VPC: $VPC_ID"

          ARNS=$(aws elbv2 describe-load-balancers \
            --region "$REGION" \
            --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" \
            --output text || true)

          if [ -z "$ARNS" ]; then
            echo "Geen ALB/NLB gevonden in deze VPC."
            exit 0
          fi

          for arn in $ARNS; do
            echo "Deleting LB: $arn"
            aws elbv2 delete-load-balancer --region "$REGION" --load-balancer-arn "$arn" || true
          done

          echo "Wachten tot LBs weg zijn..."
          for i in {1..24}; do
            left=$(aws elbv2 describe-load-balancers \
              --region "$REGION" \
              --query "length(LoadBalancers[?VpcId=='$VPC_ID'])" \
              --output text 2>/dev/null || echo "0")
            if [ "$left" = "0" ]; then
              echo "✅ Alle ELBv2 weg."
              exit 0
            fi
            echo "Nog $left LBs... ($i/24)"
            sleep 10
          done
          echo "⚠️ Sommige LBs bestaan nog, Terraform probeert alsnog VPC destroy."

      - name: Destroy VPC (retry + state-save recovery)
        working-directory: infrastructure/terraform/vpc
        shell: bash
        env:
          TF_VAR_region: ${{ github.event.inputs.aws_region }}
        run: |
          set -e

          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="key=${{ github.event.inputs.vpc_state_key }}" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="encrypt=true"

          terraform validate

          for attempt in 1 2 3 4 5; do
            echo "=== VPC destroy attempt $attempt/5 ==="
            set +e
            terraform destroy -auto-approve
            rc=$?
            set -e

            if [ $rc -eq 0 ]; then
              echo "✅ VPC destroy klaar."
              exit 0
            fi

            if [ -f "errored.tfstate" ]; then
              echo "⚠️ State save issue. Recovery: terraform state push..."
              set +e
              terraform state push -force errored.tfstate
              push_rc=$?
              set -e

              if [ $push_rc -ne 0 ]; then
                echo "⚠️ terraform state push faalde. Fallback upload via aws s3 cp..."
                aws s3 cp errored.tfstate "s3://${{ secrets.TF_STATE_BUCKET }}/${{ github.event.inputs.vpc_state_key }}" || true
              fi
            fi

            echo "VPC destroy faalde rc=$rc, wachten 30s..."
            sleep 30
          done

          echo "❌ VPC destroy faalde na 5 pogingen. Bekijk errors hierboven."
          exit 1
