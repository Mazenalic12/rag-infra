name: Terraform VPC + EKS

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infrastructure/terraform/**"

concurrency:
  group: terraform-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  AWS_REGION: "eu-central-1"
  TF_VAR_region: "eu-central-1"

  VPC_STATE_KEY: "infrastructure/terraform/vpc/terraform.tfstate"
  EKS_STATE_KEY: "infrastructure/terraform/eks/terraform.tfstate"

  TF_VAR_tf_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
  TF_VAR_vpc_state_key: "infrastructure/terraform/vpc/terraform.tfstate"



jobs:
  plan:
    name: Plan (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform PLAN - VPC
        working-directory: infrastructure/terraform/vpc
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="key=${{ env.VPC_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

          terraform fmt || true
          terraform validate
          terraform plan -no-color

      - name: Terraform PLAN - EKS
        working-directory: infrastructure/terraform/eks
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="key=${{ env.EKS_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

          terraform fmt -check
          terraform validate
          terraform plan -no-color

  apply:
    name: Apply (main)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Optioneel maar handig: maakt bucket + lock table alleen aan als ze nog niet bestaan
      - name: Ensure TF backend exists (idempotent)
        shell: bash
        run: |
          set -e
          BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          TABLE="${{ secrets.TF_LOCK_TABLE }}"
          REGION="${{ env.AWS_REGION }}"

          # S3 bucket
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "S3 bucket bestaat al: $BUCKET (skip)"
          else
            echo "S3 bucket aanmaken: $BUCKET"
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          # DynamoDB lock table
          if aws dynamodb describe-table --table-name "$TABLE" >/dev/null 2>&1; then
            echo "DynamoDB table bestaat al: $TABLE (skip)"
          else
            echo "DynamoDB table aanmaken: $TABLE"
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$TABLE"
          fi

      - name: Apply VPC (skip als geen changes)
        working-directory: infrastructure/terraform/vpc
        shell: bash
        run: |
          set -e
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="key=${{ env.VPC_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

          terraform fmt -check
          terraform validate

          set +e
          terraform plan -detailed-exitcode -out=tfplan
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "VPC: geen wijzigingen (skip apply)"
          elif [ "$code" -eq 2 ]; then
            echo "VPC: wijzigingen gevonden (apply)"
            terraform apply -auto-approve tfplan
          else
            echo "VPC: plan faalde"
            exit 1
          fi
          
      - name: Verify VPC state exists in S3
        shell: bash
        run: |
          set -e
          BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          KEY="${{ env.VPC_STATE_KEY }}"
          echo "Checking: s3://$BUCKET/$KEY"
          aws s3api head-object --bucket "$BUCKET" --key "$KEY" >/dev/null
          echo "✅ VPC state found."
        
      - name: Apply EKS (skip als geen changes)
        working-directory: infrastructure/terraform/eks
        shell: bash
        run: |
          set -e
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="key=${{ env.EKS_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

          terraform fmt -check
          terraform validate

          set +e
          terraform plan -detailed-exitcode -out=tfplan
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "EKS: geen wijzigingen (skip apply)"
          elif [ "$code" -eq 2 ]; then
            echo "EKS: wijzigingen gevonden (apply)"
            terraform apply -auto-approve tfplan
          else
            echo "EKS: plan faalde"
            exit 1
          fi
