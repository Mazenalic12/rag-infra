# -----------------------------
# Weaviate (vector DB)
# -----------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weaviate
  namespace: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
    spec:
      containers:
        - name: weaviate
          image: semitechnologies/weaviate:1.23.0
          ports:
            - containerPort: 8080
          env:
            - name: QUERY_DEFAULTS_LIMIT
              value: "25"
            - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
              value: "true"
            - name: PERSISTENCE_DATA_PATH
              value: "/var/lib/weaviate"
            - name: DEFAULT_VECTORIZER_MODULE
              value: "none"
            - name: ENABLE_MODULES
              value: ""
            - name: CLUSTER_HOSTNAME
              value: "node1"
---
apiVersion: v1
kind: Service
metadata:
  name: weaviate
  namespace: rag
spec:
  selector:
    app: weaviate
  ports:
    - port: 8080
      targetPort: 8080

# -----------------------------
# RAG Worker
# -----------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker
  namespace: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-worker
  template:
    metadata:
      labels:
        app: rag-worker
    spec:
      containers:
        - name: rag-worker
          image: REPLACE_ECR_WORKER_IMAGE
          ports:
            - containerPort: 8001
          env:
            - name: WEAVIATE_URL
              value: "http://weaviate:8080"
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: COHERE_API_KEY
            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: S3_BUCKET_NAME
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: AWS_DEFAULT_REGION
            # Quick-start (simpel, later liever via IRSA i.p.v. keys in secret)
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: AWS_SECRET_ACCESS_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: rag-worker
  namespace: rag
spec:
  selector:
    app: rag-worker
  ports:
    - port: 8001
      targetPort: 8001

# -----------------------------
# RAG API
# -----------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      containers:
        - name: rag-api
          image: REPLACE_ECR_API_IMAGE
          ports:
            - containerPort: 8000
          env:
            - name: WEAVIATE_URL
              value: "http://weaviate:8080"
            - name: WORKER_URL
              value: "http://rag-worker:8001"
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: COHERE_API_KEY
            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: S3_BUCKET_NAME
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: AWS_DEFAULT_REGION
            # Quick-start (simpel, later liever via IRSA)
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: AWS_SECRET_ACCESS_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag
spec:
  selector:
    app: rag-api
  ports:
    - port: 8000
      targetPort: 8000

# -----------------------------
# Frontend (Streamlit)
# -----------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-frontend
  template:
    metadata:
      labels:
        app: rag-frontend
    spec:
      containers:
        - name: rag-frontend
          image: REPLACE_ECR_FRONTEND_IMAGE
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://rag-api:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend-svc
  namespace: rag
spec:
  type: NodePort
  selector:
    app: rag-frontend
  ports:
    - port: 80
      targetPort: 8501

# -----------------------------
# Ingress (ALB)
# -----------------------------
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ingress
  namespace: rag
  annotations:
    kubernetes.io/ingress.class: alb
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-frontend-svc
                port:
                  number: 80
